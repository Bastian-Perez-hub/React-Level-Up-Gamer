spring.application.name=backend

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:levelup
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true